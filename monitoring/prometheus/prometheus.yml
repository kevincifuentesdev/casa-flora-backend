global:
  scrape_interval: 3s

scrape_configs:
  - job_name: "MetricasGestion"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "casa-flora-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:4000"]
