# Local PostgreSQL for development. Credentials match .env.example.
services:
  db:
    image: postgres:17-alpine
    container_name: casa-flora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: casaflora
      POSTGRES_PASSWORD: casaflora
      POSTGRES_DB: casaflora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - casa-flora-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casaflora -d casaflora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  casa-flora-data:
